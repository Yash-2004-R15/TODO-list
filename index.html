<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My To-Do List</title>
        <!--bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body {
                background: linear-gradient(135deg, hsl(0, 0%, 100%) 0%, #e66000 100%);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .card {
                border: none;
                border-radius: 12px;
                background: #ffffff;
            }
            h2 {
                color: #001f3f;
                font-weight: 600;
            }
            .btn-primary {
                background: linear-gradient(135deg, #ff24e9 0%, #d5ff05 100%);
                border: none;
            }
            .btn-primary:hover {
                background: linear-gradient(135deg, #d5ff05 0%, #ff24e9 100%);
            }
            .done {
                text-decoration: line-through;
                color: #999;
            }
        </style>
    </head>
    <body>
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card shadow p-4 w-100" style="max-width: 500px;">
                <h2 class="text-center mb-4">My To-Do List</h2>
                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Add a new task">
                    <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
                </div>
                <ul class="list-group" id="taskList"></ul>
            </div>
        </div>

        <script>
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

            function displayTasks() {
                let list = document.getElementById("taskList");
                list.innerHTML = "";
                
                tasks.forEach((task, index) => {
                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="${task.done ? 'done' : ''}" style="flex: 1;">${task.text}</span>
                            <button class="btn btn-sm ${task.done ? 'btn-success' : 'btn-warning'}" onclick="completeTask(${index})">${task.done ? 'Undo' : 'Complete'}</button>
                            <button class="btn btn-sm btn-danger ms-2" onclick="deleteTask(${index})">Delete</button>
                        </li>
                    `;
                });
            }

            function addTask() {
                let input = document.getElementById("taskInput");
                if (input.value.trim() !== "") {
                    tasks.push({text: input.value, done: false});
                    localStorage.setItem("tasks", JSON.stringify(tasks));
                    displayTasks();
                    input.value = "";
                } else {
                    alert("Please enter a task.");
                }
            }

            function completeTask(index) {
                tasks[index].done = !tasks[index].done;
                localStorage.setItem("tasks", JSON.stringify(tasks));
                displayTasks();
            }

            function deleteTask(index) {
                tasks.splice(index, 1);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                displayTasks();
            }

            document.getElementById("addTaskBtn").addEventListener("click", addTask);
            document.getElementById("taskInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") addTask();
            });

            displayTasks();
        </script>
    </body>   
</html>
